{% load static %}
<!-- Persistent Dashboard Sidebar -->
<aside class="dashboard-sidebar" id="dashboardSidebar">
  <!-- Brand Header -->
  <div class="sidebar-brand-wrap">
    <a href="{% url 'home' %}" class="sidebar-brand-link" title="ReuseHub Home" style="display: flex; align-items: center; gap: 8px;">
      <img src="{% static 'images/reusehub_logo.png' %}" alt="ReuseHub Logo" style="width: 28px; height: 28px; object-fit: contain; flex-shrink: 0;">
      <span class="brand-wordmark-title" style="color: #000000; font-weight: 800;">ReuseHub</span>
    </a>
    <button type="button" class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">
      &times;
    </button>
  </div>

  <!-- User Identity Card in Sidebar -->
  <div class="sidebar-user-block">
    <div class="sidebar-avatar-circle">
      {% if user.profile.avatar %}
        <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}" class="sidebar-avatar-img">
      {% else %}
        <span>{{ user.username|make_list|first|upper }}</span>
      {% endif %}
    </div>
    <div class="sidebar-user-info">
      <div class="sidebar-username">{{ user.username }}</div>
      <div class="sidebar-user-email">{{ user.email|default:"No email set" }}</div>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav-menu" aria-label="Dashboard Navigation">
    <ul class="sidebar-nav-list">
      <li class="sidebar-nav-item">
        <a href="{% url 'profile' %}" class="sidebar-nav-link {% if active_page == 'profile' %}active{% endif %}">
          <span class="sidebar-nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span class="sidebar-nav-label">Profile</span>
        </a>
      </li>

      <li class="sidebar-nav-item">
        <a href="{% url 'my_listings' %}" class="sidebar-nav-link {% if active_page == 'listings' %}active{% endif %}">
          <span class="sidebar-nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
          </span>
          <span class="sidebar-nav-label">My Listings</span>
        </a>
      </li>

      <li class="sidebar-nav-item">
        <a href="{% url 'my_requests' %}" class="sidebar-nav-link {% if active_page == 'requests' %}active{% endif %}">
          <span class="sidebar-nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </span>
          <span class="sidebar-nav-label">My Requests</span>
        </a>
      </li>

      <li class="sidebar-nav-item">
        <a href="{% url 'public_profile' username=user.username %}" class="sidebar-nav-link {% if active_page == 'public_profile' %}active{% endif %}">
          <span class="sidebar-nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
          <span class="sidebar-nav-label">View Public Profile</span>
        </a>
      </li>

      <li class="sidebar-nav-item sidebar-nav-item-logout">
        <a href="{% url 'logout' %}" class="sidebar-nav-link sidebar-nav-link-logout logout-trigger-btn" data-modal-target="#logoutConfirmModal">
          <span class="sidebar-nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </span>
          <span class="sidebar-nav-label">Logout</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Quick Home Navigation at Bottom -->
  <div class="sidebar-footer-links">
    <a href="{% url 'home' %}" class="sidebar-back-home">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Back to Community</span>
    </a>
  </div>
</aside>
